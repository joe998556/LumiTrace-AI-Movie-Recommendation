services:
  lumitrace:
    build: .
    ports:
      - "8080:7860"
    environment:
      LUMITRACE_VECTOR_FILE: /app/movie_index
      LUMITRACE_TEXT_SEARCH: disabled
      LUMITRACE_PRELOAD_INDEX: "true"
      LUMITRACE_PREFER_LOCAL_INDEX: "true"
      LUMITRACE_MIN_VOTE_COUNT: 100
      LUMITRACE_RECOMMEND_PER_MINUTE: 30
      LOCK_REMOTE_SEARCH_URL: "true"
    volumes:
      - ./movie_index:/app/movie_index:ro
    restart: unless-stopped
