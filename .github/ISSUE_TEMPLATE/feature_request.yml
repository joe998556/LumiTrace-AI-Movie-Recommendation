name: Feature request
description: Propose a focused improvement to recommendation quality, privacy, or usability.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The proposal can preserve browser-local taste storage.
          required: true
        - label: The proposal does not require committing keys, indexes, or private endpoints.
          required: true
