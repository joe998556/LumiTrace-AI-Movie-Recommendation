name: Feature request
description: Propose a focused improvement to local recommendation, privacy, or Android usability.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The proposal preserves device-local taste storage by default.
          required: true
        - label: The proposal does not require a LumiTrace account or mandatory backend.
          required: true
        - label: The proposal does not require committing keys, tokens, signing files, private endpoints, or unlicensed data.
          required: true
