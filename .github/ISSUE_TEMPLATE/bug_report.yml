name: Android bug report
description: Report reproducible behavior in the LumiTrace Android app.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Never include TMDB keys, Trakt credentials, OAuth tokens, journal text, or personal taste exports.
  - type: input
    id: version
    attributes:
      label: LumiTrace version
      placeholder: 1.2.0, from Settings or the GitHub Release
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installation source
      options:
        - GitHub Release APK
        - Android Studio or Gradle debug build
        - Other local build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that reliably reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Logcat excerpt
      description: Remove credentials, notes, movie history, device identifiers, and private URLs.
      render: text
