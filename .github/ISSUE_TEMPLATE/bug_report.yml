name: Bug report
description: Report reproducible behavior in the Web app, API, or vector service.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not include API keys, gateway tokens, private URLs, or personal taste exports.
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        - Metadata only
        - In-process CPU vector index
        - Standalone or remote vector service
        - Docker
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.11, Chrome 140
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
