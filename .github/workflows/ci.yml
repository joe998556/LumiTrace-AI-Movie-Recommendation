name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install flask flask-cors python-dotenv requests werkzeug pytest
      - run: python -m py_compile app.py ai_engine/bert_service.py tools/bootstrap_recommender.py
      - run: node --check script.js && node --check recommendation-core.js && node --check experience.js && node tests/test_recommendation_core.js && node tests/test_experience_contract.js
      - run: python -m pytest -q
