name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lightweight runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask flask-cors python-dotenv requests werkzeug

      - name: Python syntax checks
        run: |
          python -m py_compile \
            app.py \
            tools/check_setup.py \
            tools/bootstrap_recommender.py \
            ai_engine/bert_service.py \
            ai_engine/generate_vectors.py

      - name: JavaScript syntax check
        run: node --check script.js

      - name: Setup checker
        run: python tools/check_setup.py

      - name: Flask health smoke test
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          health = client.get("/api/health").get_json()
          assert health["status"] == "ok"
          assert "tmdb_env_key" in health["integrations"]
          html = client.get("/").data.decode("utf-8")
          assert "TMDB API Key" in html
          assert "你適合看以下這些" in html
          PY
