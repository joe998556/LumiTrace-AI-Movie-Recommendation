name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lightweight runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask flask-cors python-dotenv requests werkzeug

      - name: Python syntax checks
        run: |
          python -m py_compile \
            app.py \
            tools/check_setup.py \
            tools/bootstrap_recommender.py \
            ai_engine/bert_service.py \
            ai_engine/generate_vectors.py \
            ai_engine/generate_vectors_massive.py \
            ai_engine/generate_vectors_infinity.py \
            ai_engine/final_boss_engine.py \
            ai_engine/train_collaborative_vectors.py

      - name: JavaScript syntax check
        run: node --check script.js

      - name: Setup checker
        run: python tools/check_setup.py

      - name: Flask health smoke test
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          health = client.get("/api/health").get_json()
          assert health["status"] == "ok"
          assert "tmdb_env_key" in health["integrations"]

          index = client.get("/")
          assert index.status_code == 200
          html = index.data.decode("utf-8")
          for token in (
              "TMDB API Key",
              "movieGrid",
              "recommendFab",
              "recommendPanel",
              "recommendationGrid",
          ):
              assert token in html, token

          favorites = client.get("/favorites.html")
          assert favorites.status_code == 200
          favorites_html = favorites.data.decode("utf-8")
          assert "Favorites" in favorites_html
          assert "ratingModal" in favorites_html
          PY
