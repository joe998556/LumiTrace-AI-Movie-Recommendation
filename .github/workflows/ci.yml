name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check public repository boundary
        shell: bash
        run: |
          set -euo pipefail
          for path in .env local.properties keystore.properties app/release.jks app/release.keystore; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "Sensitive local file is tracked: $path"
              exit 1
            fi
          done
          for removed in Dockerfile compose.yaml app.py ai_engine requirements.txt; do
            if [ -e "$removed" ]; then
              echo "Obsolete backend surface returned: $removed"
              exit 1
            fi
          done

      - name: Test, lint, and assemble
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiTrace-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
