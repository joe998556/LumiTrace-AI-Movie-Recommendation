<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiTrace — Collection</title>
  <link rel="icon" href="data:,">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ground: #0a0a1a;
      --glass-bg: rgba(255,255,255,0.05);
      --glass-bg-hover: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.1);
      --glass-border-hover: rgba(255,255,255,0.2);
      --glass-blur: 16px;
      --primary: #14b8a6;
      --secondary: #5eead4;
      --gradient: linear-gradient(135deg, #14b8a6, #5eead4);
      --text-primary: #f0f0ff;
      --text-secondary: #a0a0c0;
      --text-muted: #606080;
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: linear-gradient(160deg, #06060f 0%, #100820 35%, #1a0a30 55%, #0e0618 80%, #06060f 100%); background-attachment: fixed; color: var(--text-primary); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; line-height: 1.55; min-height: 100vh; overflow-x: hidden; }
    a { color: inherit; }
    ::selection { background: rgba(20,184,166,0.3); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: transparent; }

    .poster-card {
      background: rgba(12,12,28,0.5);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(24px);
    }
    .poster-card.in-view {
      opacity: 1; transform: translateY(0);
      transition: opacity 500ms cubic-bezier(0.22,1,0.36,1), transform 600ms cubic-bezier(0.22,1,0.36,1), border-color 150ms ease-out, box-shadow 150ms ease-out;
    }
    .poster-card:hover {
      border-color: rgba(20,184,166,0.4);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(20,184,166,0.12);
      transition: transform 150ms ease-out, border-color 150ms ease-out, box-shadow 150ms ease-out;
    }

    .line-clamp-2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

    .btn { border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; transition: all 150ms ease-out; }
    .btn-gradient { background: var(--gradient); color: #fff; }
    .btn-gradient:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--glass-border); }
    .btn-ghost:hover { border-color: var(--glass-border-hover); color: var(--text-primary); }

    .chip { background: transparent; border: 1px solid var(--glass-border); border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 150ms; }
    .chip:hover { border-color: var(--glass-border-hover); color: var(--text-secondary); }

    .loader-dots { display: flex; gap: 5px; align-items: center; justify-content: center; }
    .loader-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--primary); animation: dotPulse 1.2s ease-in-out infinite; }
    .loader-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotPulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>

  <div style="position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:24px 32px;">

    <!-- Header -->
    <header style="margin-bottom:32px;">
      <a href="/" style="font-size:11px; font-weight:500; color:var(--text-muted); text-decoration:none; text-transform:uppercase; letter-spacing:0.1em; transition:color 150ms;">Back to LumiTrace</a>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:16px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <button id="toggleFavBtn" style="display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:0;" onclick="toggleSection()">
            <span id="toggleIcon" style="font-size:10px; color:var(--text-muted); display:inline-block; transition:transform 200ms;">&#9660;</span>
            <h1 style="font-size:20px; font-weight:600; letter-spacing:-0.02em;">Collection</h1>
          </button>
          <span id="favCount" style="font-size:11px; color:var(--text-muted); background:var(--glass-bg); padding:2px 8px; border-radius:4px; border:1px solid var(--glass-border);"></span>
        </div>
        <div id="batchBar" style="display:none;">
          <button class="chip" onclick="clearAll()">Clear All</button>
        </div>
      </div>
    </header>

    <!-- Favorites Grid -->
    <div id="favSection">
      <div id="favGrid" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:12px; margin-bottom:40px;"></div>
    </div>

    <!-- Empty -->
    <div id="emptyState" style="display:none; text-align:center; padding:80px 0;">
      <div style="font-size:48px; margin-bottom:16px; opacity:0.3;">&#9733;</div>
      <h2 style="font-size:16px; font-weight:500; color:var(--text-secondary); margin-bottom:8px;">No favorites yet</h2>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:24px;">Start saving movies to get personalized recommendations</p>
      <a href="/" class="btn btn-gradient" style="text-decoration:none; display:inline-block;">Browse Movies</a>
    </div>

    <!-- Recommendations -->
    <div id="recSection" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
        <h2 style="font-size:16px; font-weight:600; letter-spacing:-0.01em;">Recommended</h2>
        <span id="recReason" style="font-size:11px; color:var(--text-muted); background:var(--glass-bg); padding:3px 10px; border-radius:4px; border:1px solid var(--glass-border);"></span>
      </div>
      <div id="recGrid" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:12px;"></div>
      <div id="recSentinel" style="padding:32px 0;"><div class="loader-dots" id="recLoader" style="opacity:0"><span></span><span></span><span></span></div></div>
    </div>

  </div>

  <!-- Rating Modal -->
  <div id="ratingModal" style="position:fixed; inset:0; z-index:70; display:none; opacity:0; transition:opacity 200ms; align-items:center; justify-content:center; padding:16px;">
    <div style="position:absolute; inset:0; background:rgba(0,0,0,0.6);" id="ratingBackdrop"></div>
    <div style="position:relative; z-index:1; width:100%; max-width:380px; background:rgba(10,10,26,0.95); border:1px solid var(--glass-border); border-radius:16px; overflow:hidden; transform:scale(0.96); transition:transform 250ms cubic-bezier(0.22,1,0.36,1);">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--glass-border);">
        <span style="font-size:14px; font-weight:600;">Rate this movie</span>
        <button id="closeRatingBtn" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px;">&times;</button>
      </div>
      <div id="ratingBody" style="padding:20px;">
        <div style="display:flex; gap:14px; margin-bottom:20px;">
          <img id="ratingPoster" style="width:64px; border-radius:8px; object-fit:cover; aspect-ratio:2/3;">
          <div>
            <div id="ratingTitle" style="font-size:14px; font-weight:500;"></div>
            <div id="ratingMeta" style="font-size:11px; color:var(--text-muted); margin-top:4px;"></div>
          </div>
        </div>
        <div style="margin-bottom:16px;">
          <div style="font-size:12px; font-weight:500; color:var(--text-muted); margin-bottom:10px;">Score</div>
          <div id="ratingScoreBtns" style="display:flex; gap:6px;"></div>
        </div>
        <div style="margin-bottom:20px;">
          <div style="font-size:12px; font-weight:500; color:var(--text-muted); margin-bottom:8px;">Comment (optional)</div>
          <textarea id="ratingComment" style="width:100%; height:72px; resize:none; font-size:12px; font-family:inherit; background:rgba(255,255,255,0.03); border:1px solid var(--glass-border); border-radius:8px; padding:8px 12px; color:var(--text-primary); outline:none;" placeholder="What did you think?"></textarea>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="saveRatingBtn" class="btn btn-gradient" style="flex:1;">Save</button>
          <button id="deleteRatingBtn" class="btn btn-ghost" style="display:none;">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" style="position:fixed; inset:0; z-index:50; display:none; opacity:0; transition:opacity 200ms; align-items:center; justify-content:center; padding:16px;">
    <div style="position:absolute; inset:0; background:rgba(0,0,0,0.6);" onclick="closeModal()"></div>
    <div style="position:relative; z-index:1; width:100%; max-width:400px; background:rgba(10,10,26,0.95); border:1px solid var(--glass-border); border-radius:16px; overflow:hidden; transform:scale(0.96); transition:transform 250ms cubic-bezier(0.22,1,0.36,1);">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--glass-border);">
        <span style="font-size:13px; font-weight:600;">Why this recommendation?</span>
        <button onclick="closeModal()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px;">&times;</button>
      </div>
      <div id="modalBody" style="padding:20px; max-height:60vh; overflow-y:auto;"></div>
    </div>
  </div>

  <script>
    // Starfield
    (function() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let w, h, scrollY = 0, time = 0;
      const stars = [];
      const meteors = [];
      let nextMeteor = 300;

      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('scroll', () => scrollY = window.scrollY);

      for (let i = 0; i < 180; i++) {
        stars.push({
          x: Math.random() * 3000, y: Math.random() * 10000,
          r: 0.3 + Math.random() * 1.5,
          twinkleSpeed: 0.005 + Math.random() * 0.02,
          twinkleOffset: Math.random() * Math.PI * 2,
          drift: (Math.random() - 0.5) * 0.1,
        });
      }

      function spawnMeteor() {
        meteors.push({
          x: Math.random() * w * 0.8, y: -10,
          vx: 2 + Math.random() * 3, vy: 3 + Math.random() * 4,
          life: 1, decay: 0.015 + Math.random() * 0.01,
          len: 40 + Math.random() * 60,
        });
      }

      function draw() {
        time++;
        ctx.clearRect(0, 0, w, h);
        stars.forEach((s) => {
          const drawX = (s.x + s.drift * time) % w;
          const drawY = s.y - scrollY * 0.3;
          const wrappedY = ((drawY % (h * 3)) + h * 3) % (h * 3) - h;
          if (wrappedY < -10 || wrappedY > h + 10) return;
          const twinkle = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset));
          ctx.beginPath();
          ctx.arc(drawX, wrappedY, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200, 200, 255, ${twinkle * 0.6})`;
          ctx.fill();
          if (s.r > 1.2) {
            ctx.beginPath();
            ctx.arc(drawX, wrappedY, s.r * 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(20, 184, 166, ${twinkle * 0.1})`;
            ctx.fill();
          }
        });
        if (time > nextMeteor) { spawnMeteor(); nextMeteor = time + 300 + Math.random() * 400; }
        for (let i = meteors.length - 1; i >= 0; i--) {
          const m = meteors[i];
          m.x += m.vx; m.y += m.vy; m.life -= m.decay;
          if (m.life <= 0) { meteors.splice(i, 1); continue; }
          const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * m.len / 5, m.y - m.vy * m.len / 5);
          grad.addColorStop(0, `rgba(94, 234, 212, ${m.life * 0.9})`);
          grad.addColorStop(1, `rgba(20, 184, 166, 0)`);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(m.x - m.vx * m.len / 5, m.y - m.vy * m.len / 5);
          ctx.stroke();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // App
    const API = "http://localhost:8080/api";
    const IMG = "https://image.tmdb.org/t/p/w500";
    const KEY = "lumitrace_tmdb_key";
    const FAV = "lumitrace_favorites";
    const RATINGS = "lumitrace_ratings";
    const LANG = "en-US";
    const GENRES = { 28:"Action",12:"Adventure",16:"Animation",35:"Comedy",80:"Crime",99:"Documentary",18:"Drama",10751:"Family",14:"Fantasy",27:"Horror",9648:"Mystery",10749:"Romance",878:"Sci-Fi",53:"Thriller",37:"Western" };

    let recPage = 1, recLoading = false, recDone = false;
    const seenRec = new Set();

    // Rating modal
    let currentRatingMovie = null;
    let currentRatingScore = 0;

    function ratingBadgeHtml(movieId) {
      const r = getMovieRating(movieId);
      if (!r) return `<span class="rating-badge" data-movie-id="${movieId}" style="font-size:10px; color:var(--text-muted); cursor:pointer; padding:2px 6px; border:1px dashed var(--glass-border); border-radius:4px;">Rate</span>`;
      const c = r.score >= 8 ? "#14b8a6" : r.score >= 5 ? "#a0a0c0" : "#606080";
      return `<span class="rating-badge" data-movie-id="${movieId}" style="font-size:10px; font-weight:600; color:${c}; cursor:pointer; padding:2px 6px; background:rgba(20,184,166,0.1); border:1px solid rgba(20,184,166,0.2); border-radius:4px;">${r.score}/10</span>`;
    }

    function openRatingModal(movie) {
      currentRatingMovie = movie;
      const existing = getMovieRating(movie.id);
      currentRatingScore = existing ? existing.score : 0;
      document.getElementById("ratingPoster").src = `${IMG}${movie.poster_path}`;
      document.getElementById("ratingTitle").textContent = movie.title;
      const year = movie.release_date ? movie.release_date.slice(0, 4) : "";
      document.getElementById("ratingMeta").textContent = `${year} · TMDB ${movie.vote_average.toFixed(1)}`;
      document.getElementById("ratingComment").value = existing ? existing.comment : "";
      document.getElementById("deleteRatingBtn").style.display = existing ? "" : "none";
      const container = document.getElementById("ratingScoreBtns");
      container.innerHTML = "";
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.style.cssText = `width:32px; height:32px; border-radius:8px; border:1px solid ${i <= currentRatingScore ? "var(--primary)" : "var(--glass-border)"}; background:${i <= currentRatingScore ? "var(--gradient)" : "transparent"}; color:${i <= currentRatingScore ? "#fff" : "var(--text-muted)"}; font-size:12px; font-weight:500; font-family:inherit; cursor:pointer; transition:all 100ms;`;
        btn.addEventListener("click", () => {
          currentRatingScore = i;
          container.querySelectorAll("button").forEach((b, idx) => {
            const n = idx + 1;
            b.style.cssText = `width:32px; height:32px; border-radius:8px; border:1px solid ${n <= currentRatingScore ? "var(--primary)" : "var(--glass-border)"}; background:${n <= currentRatingScore ? "var(--gradient)" : "transparent"}; color:${n <= currentRatingScore ? "#fff" : "var(--text-muted)"}; font-size:12px; font-weight:500; font-family:inherit; cursor:pointer; transition:all 100ms;`;
          });
        });
        container.appendChild(btn);
      }
      const modal = document.getElementById("ratingModal");
      modal.style.display = "flex";
      requestAnimationFrame(() => { modal.style.opacity = "1"; modal.querySelector("div:nth-child(2)").style.transform = "scale(1)"; });
    }

    function closeRatingModal() {
      const modal = document.getElementById("ratingModal");
      modal.style.opacity = "0";
      modal.querySelector("div:nth-child(2)").style.transform = "scale(0.96)";
      setTimeout(() => { modal.style.display = "none"; }, 200);
      currentRatingMovie = null;
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderFavs();
      setupScroll();
      // Rating modal events
      document.getElementById("closeRatingBtn").addEventListener("click", closeRatingModal);
      document.getElementById("ratingBackdrop").addEventListener("click", closeRatingModal);
      document.getElementById("saveRatingBtn").addEventListener("click", () => {
        if (!currentRatingMovie || currentRatingScore === 0) return;
        const comment = document.getElementById("ratingComment").value.trim();
        saveRatingToStorage(currentRatingMovie.id, currentRatingScore, comment);
        closeRatingModal();
        renderFavs();
      });
      document.getElementById("deleteRatingBtn").addEventListener("click", () => {
        if (!currentRatingMovie) return;
        deleteRatingFromStorage(currentRatingMovie.id);
        closeRatingModal();
        renderFavs();
      });
    });

    const getFavs = () => { try { return JSON.parse(localStorage.getItem(FAV) || "[]"); } catch { return []; } };
    const saveFavs = (f) => localStorage.setItem(FAV, JSON.stringify(f));
    const getRatings = () => { try { return JSON.parse(localStorage.getItem(RATINGS) || "{}"); } catch { return {}; } };
    const saveRatingToStorage = (id, score, comment) => { const r = getRatings(); r[id] = { score, comment: comment || "", updatedAt: Date.now() }; localStorage.setItem(RATINGS, JSON.stringify(r)); };
    const deleteRatingFromStorage = (id) => { const r = getRatings(); delete r[id]; localStorage.setItem(RATINGS, JSON.stringify(r)); };
    const getMovieRating = (id) => getRatings()[id] || null;
    const getKey = () => localStorage.getItem(KEY) || "";
    async function tmdb(path) {
      const r = await fetch(`${API}/tmdb/${path}`, { headers: getKey() ? { "X-TMDB-API-Key": getKey() } : {} });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || "TMDB failed"); return d;
    }

    let favCollapsed = false;
    function toggleSection() {
      favCollapsed = !favCollapsed;
      const s = document.getElementById("favSection");
      const i = document.getElementById("toggleIcon");
      const b = document.getElementById("batchBar");
      if (favCollapsed) {
        s.style.maxHeight = s.scrollHeight + "px";
        requestAnimationFrame(() => { s.style.maxHeight = "0"; s.style.opacity = "0"; s.style.overflow = "hidden"; });
        i.style.transform = "rotate(-90deg)";
        b.style.display = "none";
      } else {
        s.style.overflow = "";
        s.style.maxHeight = s.scrollHeight + "px";
        s.style.opacity = "1";
        i.style.transform = "rotate(0)";
        if (getFavs().length) b.style.display = "";
        setTimeout(() => s.style.maxHeight = "none", 350);
      }
    }

    function renderFavs() {
      const favs = getFavs();
      const grid = document.getElementById("favGrid");
      const empty = document.getElementById("emptyState");
      const batch = document.getElementById("batchBar");
      const rec = document.getElementById("recSection");
      document.getElementById("favCount").textContent = favs.length > 0 ? favs.length : "";

      if (!favs.length) {
        grid.innerHTML = "";
        empty.style.display = "block";
        batch.style.display = "none";
        rec.style.display = "none";
        return;
      }
      empty.style.display = "none";
      if (!favCollapsed) batch.style.display = "";
      rec.style.display = "";

      grid.innerHTML = "";
      favs.forEach((m, idx) => {
        const card = document.createElement("div");
        card.className = "poster-card";
        card.style.position = "relative";
        const year = m.release_date ? m.release_date.slice(0, 4) : "";
        const s = m.vote_average;
        const c = s >= 7 ? "#14b8a6" : "#606080";

        card.innerHTML = `
          <a href="https://www.themoviedb.org/movie/${m.id}" target="_blank" rel="noopener" style="display:block; text-decoration:none;">
            <img style="aspect-ratio:2/3; width:100%; object-fit:cover;" src="${IMG}${m.poster_path}" alt="${esc(m.title)}" loading="lazy">
          </a>
          <div style="padding:10px;">
            <div class="line-clamp-2" style="font-size:12px; font-weight:500; min-height:2.4em; line-height:1.2;">${esc(m.title)}</div>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:6px; font-size:11px;">
              <span style="color:#606080;">${year}</span>
              <span style="color:${c};">${s.toFixed(1)}</span>
            </div>
            <div style="margin-top:6px;">${ratingBadgeHtml(m.id)}</div>
            <button class="remove-btn" style="width:100%; margin-top:8px; padding:6px 0; border-radius:8px; font-size:11px; font-weight:500; font-family:inherit; cursor:pointer; background:var(--gradient); color:#fff; border:none; transition:all 150ms; display:flex; align-items:center; justify-content:center; gap:4px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Saved
            </button>
          </div>`;

        card.querySelector(".remove-btn").addEventListener("click", () => {
          saveFavs(getFavs().filter((f) => f.id !== m.id));
          renderFavs();
          resetRec();
        });
        card.querySelector(".rating-badge").addEventListener("click", (e) => { e.stopPropagation(); openRatingModal(m); });
        grid.appendChild(card);
        requestAnimationFrame(() => card.classList.add("in-view"));
      });
    }

    function clearAll() { if (!getFavs().length) return; saveFavs([]); renderFavs(); resetRec(); }

    function setupScroll() {
      window.addEventListener("scroll", () => {
        const s = document.getElementById("recSection");
        if (s.style.display === "none" || recLoading || recDone) return;
        const r = s.getBoundingClientRect();
        if (r.bottom < window.innerHeight + 300) loadRec();
      });
      new MutationObserver(() => {
        const s = document.getElementById("recSection");
        if (s.style.display !== "none" && !document.getElementById("recGrid").children.length) loadRec();
      }).observe(document.getElementById("recSection"), { attributes: true, attributeFilter: ["style"] });
    }

    function resetRec() { recPage = 1; recLoading = false; recDone = false; seenRec.clear(); document.getElementById("recGrid").innerHTML = ""; document.getElementById("recReason").textContent = ""; }

    async function loadRec() {
      if (recLoading || recDone) return;
      recLoading = true;
      document.getElementById("recLoader").style.opacity = "1";
      try {
        const favs = getFavs();
        if (!favs.length) { recDone = true; recLoading = false; document.getElementById("recLoader").style.opacity = "0"; return; }
        const favIds = new Set(favs.map((m) => m.id));

        if (recPage === 1) {
          try {
            const payload = { overviews: favs.map((m) => m.overview).filter(Boolean), exclude_ids: favs.map((m) => m.id), user_genre_ids: favs.map((m) => m.genre_ids || []), user_vote_counts: favs.map((m) => m.vote_count || 0), top_k: 18 };
            if (payload.overviews.length) {
              const r = await fetch(`${API}/semantic-recommendations`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
              if (r.ok) {
                const d = await r.json();
                const res = normSem(d.results || []);
                if (res.length) { res.forEach((m) => seenRec.add(m.id)); appendCards(res); document.getElementById("recReason").textContent = `BERT · ${favs.length} favorites`; recPage = 2; recLoading = false; document.getElementById("recLoader").style.opacity = "0"; return; }
              }
            }
          } catch {}
        }

        const p = buildProfile(favs);
        if (!p.gids.length) { recDone = true; recLoading = false; document.getElementById("recLoader").style.opacity = "0"; return; }
        const d = await tmdb(`discover/movie?language=${LANG}&sort_by=vote_average.desc&vote_count.gte=150&with_genres=${p.gids.slice(0,3).join(",")}&page=${recPage}`);
        const raw = normMovies(d.results || []).filter((m) => !favIds.has(m.id) && !seenRec.has(m.id));
        raw.forEach((m) => seenRec.add(m.id));
        if (!raw.length) { recDone = true; document.getElementById("recReason").textContent = "No more"; }
        else {
          const scored = raw.map((m) => ({ ...m, _r: score(m, p) }));
          const mx = Math.max(1, ...scored.map((m) => m._r));
          const cands = scored.map((m) => ({ ...m, recScore: Math.round((m._r / mx) * 95) + 5 })).sort((a, b) => b.recScore - a.recScore);
          appendCards(cands); recPage++;
          document.getElementById("recReason").textContent = `Page ${recPage - 1}`;
        }
      } catch (e) { document.getElementById("recReason").textContent = e.message; }
      recLoading = false;
      document.getElementById("recLoader").style.opacity = "0";
    }

    function appendCards(movies) {
      const grid = document.getElementById("recGrid");
      const existing = new Set(Array.from(grid.querySelectorAll("[data-title]")).map((e) => e.dataset.title));
      movies.forEach((m) => {
        if (existing.has(m.title)) return;
        existing.add(m.title);
        const card = makeCard(m);
        grid.appendChild(card);
        requestAnimationFrame(() => card.classList.add("in-view"));
      });
    }

    function makeCard(m) {
      const favIds = new Set(getFavs().map((f) => f.id));
      const card = document.createElement("div");
      card.className = "poster-card";
      card.style.position = "relative";
      const active = favIds.has(m.id);
      const year = m.release_date ? m.release_date.slice(0, 4) : "";
      const s = m.vote_average;
      const c = s >= 7 ? "#14b8a6" : "#606080";

      card.innerHTML = `
        <img style="aspect-ratio:2/3; width:100%; object-fit:cover;" src="${IMG}${m.poster_path}" alt="${esc(m.title)}" loading="lazy">
        <div style="padding:10px;">
          <div data-title="${esc(m.title)}" class="line-clamp-2" style="font-size:12px; font-weight:500; min-height:2.4em; line-height:1.2;">${esc(m.title)}</div>
          <div style="display:flex; align-items:center; justify-content:space-between; margin-top:6px; font-size:11px;">
            <span style="color:#606080;">${year}</span>
            <span style="color:${c};">${s.toFixed(1)}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px; margin-top:6px;">
            ${m.recScore ? `<span style="font-size:10px; padding:2px 6px; border-radius:4px; background:rgba(20,184,166,0.15); color:#14b8a6;">${m.recScore}%</span>` : ""}
            ${ratingBadgeHtml(m.id)}
            <button class="why-btn" style="font-size:10px; color:#606080; background:none; border:none; cursor:pointer; margin-left:auto; padding:0;">why?</button>
          </div>
          <button class="fav-btn" style="width:100%; margin-top:8px; padding:6px 0; border-radius:8px; font-size:11px; font-weight:500; font-family:inherit; cursor:pointer; transition:all 150ms; ${active ? "background:var(--gradient); color:#fff; border:none;" : "background:transparent; color:#606080; border:1px solid var(--glass-border);"}">${active ? "Saved" : "Save"}</button>
        </div>`;

      card.querySelector(".fav-btn").addEventListener("click", () => {
        const all = getFavs();
        const exists = all.some((f) => f.id === m.id);
        const next = exists ? all.filter((f) => f.id !== m.id) : [...all, m];
        saveFavs(next);
        renderFavs();
        const isFav = next.some((f) => f.id === m.id);
        const btn = card.querySelector(".fav-btn");
        btn.style.cssText = `width:100%; margin-top:8px; padding:6px 0; border-radius:8px; font-size:11px; font-weight:500; font-family:inherit; cursor:pointer; transition:all 150ms; ${isFav ? "background:var(--gradient); color:#fff; border:none;" : "background:transparent; color:#606080; border:1px solid var(--glass-border);"}`;
        btn.textContent = isFav ? "Saved" : "Save";
      });

      card.querySelector(".why-btn").addEventListener("click", () => showWhy(m));
      card.querySelector(".rating-badge").addEventListener("click", (e) => { e.stopPropagation(); openRatingModal(m); });
      return card;
    }

    function showWhy(m) {
      const favs = getFavs();
      const p = buildProfile(favs);
      const rs = buildReasons(m, p, favs);
      document.getElementById("modalBody").innerHTML = `
        <div style="display:flex; gap:12px; margin-bottom:16px;">
          <img src="${IMG}${m.poster_path}" style="width:72px; border-radius:8px; object-fit:cover; aspect-ratio:2/3;">
          <div>
            <div style="font-size:13px; font-weight:500; margin-bottom:4px;">${esc(m.title)}</div>
            <div style="font-size:11px; color:#606080;">${m.release_date?.slice(0,4)||""} · ${m.vote_average.toFixed(1)} · ${(m.vote_count||0).toLocaleString()} votes</div>
            ${m.recScore ? `<div style="margin-top:6px; font-size:10px; padding:2px 6px; border-radius:4px; background:rgba(20,184,166,0.15); color:#14b8a6; width:fit-content;">Match ${m.recScore}%</div>` : ""}
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${rs.length ? rs.map((r) => `
            <div style="display:flex; gap:10px; padding:12px; border-radius:8px; background:var(--glass-bg); border:1px solid var(--glass-border);">
              <span style="font-size:14px; flex-shrink:0;">${r.icon}</span>
              <div>
                <div style="font-size:12px; font-weight:500; color:var(--text-secondary);">${r.title}</div>
                <div style="font-size:11px; color:#606080; line-height:1.5; margin-top:2px;">${r.detail}</div>
              </div>
            </div>`).join("") : '<div style="font-size:12px; color:#606080; text-align:center; padding:24px;">Save more movies for analysis.</div>'}
        </div>`;
      const modal = document.getElementById("modal");
      modal.style.display = "flex";
      requestAnimationFrame(() => { modal.style.opacity = "1"; modal.querySelector("div:nth-child(2)").style.transform = "scale(1)"; });
    }

    function closeModal() {
      const modal = document.getElementById("modal");
      modal.style.opacity = "0";
      modal.querySelector("div:nth-child(2)").style.transform = "scale(0.96)";
      setTimeout(() => modal.style.display = "none", 200);
    }

    function buildReasons(m, p, favs) {
      const mg = m.genre_ids || [];
      const rs = [];
      const matched = mg.filter((id) => p.gw.has(id));
      if (matched.length) {
        const top = matched.sort((a, b) => (p.gw.get(b)||0) - (p.gw.get(a)||0))[0];
        const cnt = p.gw.get(top) || 0;
        rs.push({ icon: "&#9733;", title: `You love ${GENRES[top]}`, detail: `${cnt} saved ${GENRES[top]} movie${cnt>1?"s":""}.`, w: 40 });
      }
      if (Math.abs(m.vote_average - p.avg) < 1.5) rs.push({ icon: "&#9830;", title: "Rating match", detail: `Your avg ${p.avg.toFixed(1)} — this is ${m.vote_average.toFixed(1)}.`, w: 25 });
      if (m.vote_count >= 10000) rs.push({ icon: "&#9650;", title: "Popular", detail: `${m.vote_count.toLocaleString()} ratings.`, w: 20 });
      if (m.recScore >= 70) rs.push({ icon: "&#9670;", title: "Theme match", detail: "Plot and atmosphere are very similar.", w: 35 });
      const fm = favs.map((f) => ({ t: f.title, o: (f.genre_ids||[]).filter((id) => mg.includes(id)).length })).sort((a,b) => b.o - a.o);
      if (fm.length && fm[0].o >= 2) rs.push({ icon: "&#9654;", title: `Like "${fm[0].t}"`, detail: `Shares ${fm[0].o} genres.`, w: 15 });
      return rs.sort((a, b) => b.w - a.w).slice(0, 3);
    }

    function normMovies(m) { return m.filter((x) => x?.poster_path).map((x) => ({ id: x.id, title: x.title||x.name||"", overview: x.overview||"", poster_path: x.poster_path, release_date: x.release_date||"", vote_average: +x.vote_average||0, vote_count: +x.vote_count||0, genre_ids: x.genre_ids||[] })); }
    function normSem(m) { const f = m.filter((x) => x?.poster_path); const mx = Math.max(0.001, ...f.map((x) => +x.score||+x.semantic_score||0)); return f.map((x) => { const r = +x.score||+x.semantic_score||0; return { id: x.id, title: x.title||"", overview: x.overview||"", poster_path: x.poster_path, release_date: x.release_date||"", vote_average: +x.vote_average||0, vote_count: +x.vote_count||0, genre_ids: x.genre_ids||[], recScore: Math.max(1, Math.min(100, Math.round((r/mx)*70)+30)) }; }); }
    function buildProfile(favs) { const gw = new Map(); let avg = 0; favs.forEach((m) => { avg += m.vote_average||0; (m.genre_ids||[]).forEach((id) => gw.set(id, (gw.get(id)||0)+1)); }); return { gids: [...gw.entries()].sort((a,b) => b[1]-a[1]).map(([id]) => id), gw, avg: favs.length?avg/favs.length:0 }; }
    function score(m, p) { const gs = (m.genre_ids||[]).reduce((s, id) => s+(p.gw.get(id)||0), 0); return gs*25 + Math.max(0, m.vote_average-5)*7 + Math.min(20, Math.log10(Math.max(1, m.vote_count))*6) + Math.max(0, 10-Math.abs(m.vote_average-p.avg))*2; }
    function esc(v) { const d = document.createElement("div"); d.textContent = v||""; return d.innerHTML; }
  </script>
</body>
